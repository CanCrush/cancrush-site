<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Get Can Crush — App Store & Google Play</title>
  <meta name="description" content="Download Can Crush on iOS or Android and get ranked on the world's crush leaderboard." />
  <link rel="canonical" href="https://cancrush.ai/get" />

  <!-- Open Graph so shares preview cleanly -->
  <meta property="og:title" content="Get Can Crush" />
  <meta property="og:description" content="Download Can Crush on iOS or Android. Crush a can. Get ranked." />
  <meta property="og:url" content="https://cancrush.ai/get" />
  <meta property="og:type" content="website" />

  <!-- Smart App Banner for iOS Safari — surfaces the App Store install
       button natively even before the JS redirect fires. Same app id
       used on the root index.html. -->
  <meta name="apple-itunes-app" content="app-id=6761695462" />

  <!--
    Mobile-first redirect. Runs in <head> so iOS / Android users are
    kicked to the right store BEFORE the desktop landing page paints.
    iPadOS 13+ reports as Mac; we detect it via touch-points + platform
    so iPad users go to the App Store, not the desktop fallback.
  -->
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var platform = navigator.platform || "";
      var ios = "https://apps.apple.com/app/id6761695462";
      var android = "https://play.google.com/store/apps/details?id=ai.cancrush.app";

      var isIOS =
        /iPhone|iPad|iPod/i.test(ua) ||
        // iPadOS 13+ masquerades as Mac; the touch-point heuristic
        // catches it without false-positiving on real Macs.
        (platform === "MacIntel" && navigator.maxTouchPoints > 1);

      var isAndroid = /Android/i.test(ua);

      if (isIOS) {
        location.replace(ios);
      } else if (isAndroid) {
        location.replace(android);
      }
      // Desktop / anything else: fall through and render the landing page.
    })();
  </script>

  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* Page-local overrides — /get is a focused landing screen, not
       the full marketing site. Keep the palette + card treatment
       inherited from styles.css, but tighten the layout. */
    .wrap-get {
      max-width: 640px;
      margin: 0 auto;
      padding: 72px 20px 60px;
      text-align: center;
    }

    /* Big display headline. "CRUSH" is squashed vertically to visually
       communicate a flattened can — a subtle brand-native flourish. */
    .display {
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
      margin: 0;
      display: inline-flex;
      align-items: baseline;
      gap: 12px;
    }
    .display .can {
      font-size: 88px;
      color: var(--text);
    }
    .display .crush {
      font-size: 96px;
      color: var(--accent);
      transform: scaleY(0.55);
      transform-origin: center bottom;
      display: inline-block;
      text-shadow: 0 6px 24px rgba(255, 90, 31, 0.35);
    }

    .tag {
      margin: 20px 0 44px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
    }

    .stores {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 28px;
    }

    /* Store-badge buttons. Not the official Apple/Google raster
       badges (those require exact rules on padding + can't be
       recolored). Custom flat treatment that lives in-brand and
       is fully accessible. */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 22px;
      background: #000;
      color: #fff;
      border-radius: 14px;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      min-width: 200px;
    }
    .badge:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    .badge svg { flex-shrink: 0; }
    .badge .txt {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.1;
      text-align: left;
    }
    .badge .txt .small {
      font-size: 11px;
      opacity: 0.85;
      margin: 0;
      color: rgba(255, 255, 255, 0.85);
    }
    .badge .txt .big {
      font-size: 20px;
      font-weight: 700;
      margin-top: 2px;
      color: #fff;
    }

    .foot {
      margin-top: 48px;
      color: rgba(245, 245, 245, 0.6);
      font-size: 13px;
    }
    .foot a {
      color: rgba(245, 245, 245, 0.85);
      text-decoration: none;
    }
    .foot a:hover { text-decoration: underline; }

    /* Fallback link that only shows if the mobile redirect somehow
       fails to fire (JS disabled, weird UA sniff). Hidden by default
       and shown after a short delay so mobile users who ARE being
       redirected don't see a flash of "tap here". */
    .fallback {
      opacity: 0;
      margin-top: 24px;
      color: rgba(245, 245, 245, 0.65);
      font-size: 14px;
      transition: opacity 0.3s ease;
    }

    @media (max-width: 480px) {
      .display .can { font-size: 64px; }
      .display .crush { font-size: 72px; }
      .tag { font-size: 16px; }
      .badge { min-width: 0; flex: 1 1 auto; padding: 12px 16px; }
      .badge .txt .big { font-size: 17px; }
    }
  </style>
</head>

<body>
  <div class="wrap-get">
    <h1 class="display" aria-label="Can Crush">
      <span class="can">CAN</span><span class="crush">CRUSH</span>
    </h1>

    <p class="tag">
      Crush a can. Get ranked on the world's crush leaderboard.<br>
      Available on iPhone and Android.
    </p>

    <div class="stores">
      <a class="badge" href="https://apps.apple.com/app/id6761695462" aria-label="Download on the App Store">
        <!-- Apple logo (single-color, works on dark button) -->
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M16.365 1.43c0 1.14-.43 2.213-1.16 2.99-.85.93-2.23 1.65-3.29 1.56-.13-1.11.41-2.28 1.14-3.06.83-.86 2.24-1.5 3.31-1.49zM20.9 17.7c-.55 1.27-1.22 2.53-2.22 2.55-.98.02-1.3-.58-2.42-.58-1.12 0-1.47.55-2.4.6-.96.04-1.7-1.37-2.26-2.63-1.13-2.57-2-7.27.83-10.44.79-.9 2.2-1.47 3.55-1.5 1 .02 1.94.68 2.55.68.6 0 1.75-.83 2.94-.71.5.02 1.9.2 2.8 1.51-.07.05-1.67.98-1.65 2.9.02 2.29 1.98 3.06 2 3.07-.02.06-.31 1.07-1.01 2.12l-1.71 2.43z"/>
        </svg>
        <span class="txt">
          <span class="small">Download on the</span>
          <span class="big">App Store</span>
        </span>
      </a>

      <a class="badge" href="https://play.google.com/store/apps/details?id=ai.cancrush.app" aria-label="Get it on Google Play">
        <!-- Google Play triangle mark, four-color -->
        <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 20.5V3.5c0-.44.24-.83.62-1.03L14.5 12 4.12 21.53c-.38-.2-.62-.59-.62-1.03z" fill="#00c1de"/>
          <path d="M14.5 12l3-3 4.14 2.39c.5.29.5 1.01 0 1.3l-4.14 2.4-3-3.09z" fill="#ffbc00"/>
          <path d="M17.5 9L4.12 2.47l10.38 9.02 3-2.49z" fill="#00da77"/>
          <path d="M17.5 15L4.12 21.53l10.38-9.02 3 2.49z" fill="#ff2d2d"/>
        </svg>
        <span class="txt">
          <span class="small">GET IT ON</span>
          <span class="big">Google Play</span>
        </span>
      </a>
    </div>

    <p class="fallback" id="fallback">
      On mobile and nothing happened? <a href="https://apps.apple.com/app/id6761695462">Open App Store</a> or <a href="https://play.google.com/store/apps/details?id=ai.cancrush.app">Open Google Play</a>.
    </p>

    <p class="foot">
      <a href="/">Back to cancrush.ai</a> · <a href="mailto:support@cancrush.ai">support@cancrush.ai</a>
    </p>
  </div>

  <script>
    // Reveal the fallback link only after 1.5s — if the head redirect
    // fired, this page never renders long enough to matter; if it
    // didn't fire, the user gets a visible escape hatch.
    setTimeout(function () {
      var el = document.getElementById("fallback");
      if (el) el.style.opacity = "1";
    }, 1500);
  </script>
</body>
</html>
